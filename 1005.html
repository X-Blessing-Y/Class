<html>
    <head>
        <title>1005-css容器設定</title>
        <style>
            #d1{
                width: 100px;
                height: 100px;
                background-color: rgb(206, 199, 191);
                border: 1px solid rgb(255, 21, 91);  
                border-color: rgb(139, 203, 255) rgb(123, 255, 204) rgb(255, 158, 13) rgb(222, 49, 245);
                border-width: 16px 8px 10px 5px;
                border-style:inset;
                /* border-style:solid/dashed/dotted/doule */
                padding: 10px; /* 填充 */
                /*box-sizing: border-box; 盒子大小*/
                margin-bottom: 10px;
            }
            #d2{
                border:10px solid black;
                height: 50px;
                width: 50px;
                border-radius: 10px 5px 16px 20px;
                margin: 20px;
            }
            #d3{
               border:10px solid black;
                height: 50px;
                width: 75px; 
                border-radius: 50%;
                margin: 20px;
            }

        #d4{
                border:10px solid black;
                border-color: rgb(255, 255, 255) rgb(246, 253, 250) rgb(255, 158, 13) rgb(222, 49, 245);
                border-width: 16px 8px 10px 5px;
                height: 0px;
                width: 75px; 
                margin: 50px
            }
            
        #d5{
               border:35px solid black;
                border-color: rgb(255, 255, 255) rgb(255, 255, 255) rgb(255, 158, 13) rgb(255, 255, 255);
                height: 0px;
                width: 50px; 
                border-top-width: 0;
            }
        #d6{
               border:60px solid black;
                border-color: rgb(255, 158, 13) rgb(255, 255, 255) rgb(255, 255, 255) rgb(255, 255, 255);
                height: 0px;
                width:0px; 
            }
        #d7 {
			width: 0px;
			height: 0px;
			border: 40px solid transparent;
			border-bottom-color: green;
			border-top-width: 0;
			margin-left:20px;
		}
		#d8 {
			width: 20px;
			height: 0px;
			border: 40px solid transparent;
			border-bottom-color: green;
			border-top-width: 0;
			margin-left:10px;
		}
		#d9 {
			width: 40px;
			height: 0px;
			border: 40px solid transparent;
			border-bottom-color: green;
			border-top-width: 0;
		}
		#d10 {
			width: 40px;
			height: 50px;
			background-color: brown;
			margin-left:40px;
		}
		
		    #d11 {
    		width: 0px;
    		height: 0px;
    		border: 40px solid transparent;
    		border-bottom-color: rgb(88, 226, 90);
    		border-top-width: 0;
    	}


    		#d12 {
    		width: 0px;
    		height: 0px;
    		border: 40px solid transparent;
    		border-top-color: rgb(209, 108, 68); 
   			border-bottom-width: 0;
    	}				
            






        
        
        </style>
    </head>





    <body>
        <div id="d1">1111111111111111111</div>
        <div id="d2">000</div>
        <div id="d3">1</div>
        <div id="d4"></div><hr>
        <div id="d5"></div>
        <div id="d6"></div>
        <div id="d7"></div>
        <div id="d8"></div>
        <div id="d9"></div>
        <div id="d10"></div><hr>
		<div id="d11"></div>
		<div id="d12"></div>
    </body>




























</html>
