<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>1116-Js計時器</title>
    <style>
        .digit{
            font-size: 100pt;
        }

    </style>
    <script>
        var timer_sec=0; 
        var timer_id=-1; 

        function timer_start(){
            timer_id=setInterval(function(){
                timer_sec++;
                if(timer_sec<10){
                    document.getElementById("timer").innerHTML=`0${timer_sec}`;
                }else{
                    document.getElementById("timer").innerHTML=timer_sec;
                }
            },1000)

        
            

        }
        function timer_stop(){
            if(timer_id<0) return;
            clearInterval(timer_id);
            timer_id=-1;
        }
        function timer_reset(){
            timer_stop();
            document.getElementById("timer").innerHTML="00";
            timer_sec="0";
        }
        function getRandom(min,max){
            return Math.floor(Math.random()*(max - min +1))+min;
        }
        function getLottery(){
            setTimeout(clearInterval,3000,setInterval(()=>{
                var x=getRandom(0,99);
                document.getElementById("lottery").innerHTML=((x<10)?"0":"")+x;
            },10));
        }
        function getDice(img){
            setTimeout(clearInterval,3000,
                setInterval((img)=>{
                    img.src=`picture/dice$(getRandom(1,6)}.png`;
                },50,event.target)
            );           
        }

            
    </script>

</head>
<body>
<div id="timer" class="digit">00</div>
<button onclick="timer_start()" style="background-color: rgb(185, 255, 208);">開始</button>
<button onclick="timer_stop()" style="background-color: rgb(255, 192, 192);">暫停</button>
<button onclick="timer_reset()" style="background-color: rgb(188, 195, 255);">重設</button>
<hr>
<div id="lottery" class="digit">00</div>
<button onclick="getLottery()" style="background-color: rgb(249, 255, 166);">樂透</button>
<hr>
<img src="picture/dice0.png" width="100px" onclick="getDice()">





</body>





</html>
