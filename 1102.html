<!DOCTYPE html>
<html>
<head>
    <title>1102-JaveScript輸出與輸入</title>
    <style>
        #ans{
            width: 300px;
            height: 200px;
            background-color: aquamarine;

        }
    </style>
    <script>
        function www(){
            name = prompt("name???");

            if(confirm("Are you sure???")){
                alert("ok Hello :)");
            }else{
                alert("Don't do THAT!!!");

            }
        }





        function say() {
            console.log("abc1");
            
            alert("abc2");

            ans = prompt(" It is abc3?");
            console.log(ans + " is " + typeof(ans) + " type");
        
            ans = confirm("Isn't it abc4 ?");
            console.log(ans + " is " + typeof(ans) + " type");

            document.getElementById("ans").innerHTML="abc5";
            
            
        }
        function setVol(){
            document.getElementById("a,b,c").innerHTML = document.getElementById("abc-count").value;
        }

        function setBGcolar(){
            document.getElementById("ans").style.backgroundColor = document.getElementById("bgcolar").value;
        }

        function add(){
            a1=parseInt(document.getElementById("a1").value);
            a2=parseInt(document.getElementById("a2").value);
            document.getElementById("addans").innerHTML = (a1 + a2);
        }


    </script>
</head>
<body>
    <button onclick="www();">www</button>
    <button onclick="say();">hi</button>
    <div id = "ans"></div> 
    <hr>
    <input type="text" value="text"><br>
    <input type="password" value="password"><br>
    <input type="number" value="123"><br>
    <input type="date" value="2026-11-02"><br>
    <input type="datetime-local" value="2026-11-02T08:00"><br>
    <input type="color" value="#FF0000" id="bgcolar" oninput="setBGcolar();"><br>
    <input type="range" id="abc-count" min="1" max="10" value="5" oninput="setVol()"><span id="a,b,c">0</span>
                                                                  <!--onchange-->
    <hr>
    <input type="number" id="a1"> + <input type="number" id="a2">  <button onclick="add()">????</button> <span id="addans"></span>          






    
</body>
























</html>
