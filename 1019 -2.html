<!DOCTYPE html>
<html>
<head>
    <title>1019-變形與轉變</title>
    <style>


        div{
            width: 100px;
            height: 50px;
            border: 2px solid black;            
            margin: 50px;
        }       
        
        #d1{
            transform: rotate(45deg); /*順時針旋轉*/
        }
        
        #d2{
            transform: rotate(-45deg);/*逆時針旋轉*/
        }
        #d3{
            transform: scale(0.5,1.2);/*倍率*/
        }        
        #d4{
            transform: translate(20px,10px);
        }           
        #d4{
            transform: translate(50px) rotate(45deg);
        }     
        #d5:hover{
            background-color: rgb(194, 194, 0);
        }               
        #d6{
            background-color: blueviolet;
            transition: transform 2s;
        }               
        #d6:hover{
            background-color: blue;
            transform: translate(50px) rotate(45deg);
        }             
        #d7{
           box-shadow: 10px 20px rgb(65, 0, 168);
        }             
        #d8{
           box-shadow: 10px 20px 10px  rgb(1, 53, 112);
        }   
        #d9{
            font-size:100px;
            color:black;
            text-shadow:0px 0px 10px pink;
               
            
               
        



    </style>




</head>
<body>
    <div id="d1"></div>
    <div id="d2"></div>
    <div id="d3"></div>
    <div id="d4"></div>
    <div id="d5"></div>
    <div id="d6"></div>
    <div id="d7"></div>
    <div id="d8"></div>
    <p id="d9">文字</p>
    </div>












</body>





</html>
